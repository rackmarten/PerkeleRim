name: Bug report
description: Something broke, crashed, or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Spawn at the garage
        2. Drive the Satsuma towards Whiterun
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Bug report zip
      description: |
        Run **Report a bug.bat** (next to Start PerkeleRim.bat) and drag the PerkeleRim-bug-<date>.zip it puts in the Bug reports folder next to the launcher into this box. It holds your PerkeleRim logs, PerkeleRim.ini and the game versions, with your Windows user name taken out. Nothing is sent anywhere until you submit this form.
  - type: input
    id: skyrim
    attributes:
      label: Skyrim runtime version
      description: Filled in by Report a bug.bat.
      placeholder: e.g. 1.6.1170
    validations:
      required: true
  - type: input
    id: msc
    attributes:
      label: My Summer Car and MSCLoader versions
      description: Filled in by Report a bug.bat.
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: PerkeleRim version or commit
      description: Filled in by Report a bug.bat.
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Anything else installed in either game.
