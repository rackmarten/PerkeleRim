name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The game-free tests on Linux (scripts/test.sh): a quick check next to the Windows build.
  # The shared memory link's tests need Windows and run in the build job's scripts/test.ps1.
  protocol-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Unit tests
        run: ./scripts/test.sh

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # vcpkg binary cache (its default archive location), keyed on the manifest and baseline.
      - uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: vcpkg-${{ hashFiles('skse/vcpkg.json', 'skse/vcpkg-configuration.json', 'protocol/vcpkg.json') }}
          restore-keys: vcpkg-

      # CommonLibSSE-NG detects GITHUB_ACTIONS and links its prebuilt release bundle when the
      # submodule sits on a release tag and the MSVC toolset matches; otherwise it builds from source.
      - name: Build SKSE plugin
        shell: pwsh
        run: ./scripts/build.ps1 -Target skse

      # My Summer Car, Unity and MSCLoader DLLs can't be redistributed, so CI compiles the mod
      # against hand-written stubs of the API it uses (msc/stubs). This catches C# compile errors,
      # not API drift against the real MSCLoader; local builds use the real DLLs.
      - name: Build MSCLoader mod (stub references)
        shell: pwsh
        run: ./scripts/build.ps1 -Target msc -UseStubs

      # Protocol unit tests: C++ (doctest via ctest) and C# (dotnet test). No game install needed.
      - name: Unit tests
        shell: pwsh
        run: ./scripts/test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PerkeleRim-${{ github.sha }}
          path: |
            skse/build/release/PerkeleRim.dll
            skse/build/release/PerkeleRim.pdb
            msc/bin/stubs/Release/net35/PerkeleRim.dll
          if-no-files-found: error
